[project]
name = "drawio-agent"
version = "1.0.0"
description = "AI-powered cloud architecture diagram generator — natural language to live draw.io diagrams."
requires-python = ">=3.11"

# Dependencies are declared in requirements.txt, not here. This project is
# deployed as an application, not installed as a package, so there is one
# source of truth for what gets installed and it is the file pip is pointed at.

[tool.pytest.ini_options]
testpaths = ["tests"]
# Quiet by default; the suite is large and the signal is the summary line.
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv", "data", "logs", "static", ".claude", ".cursor", "tools"]

[tool.ruff.lint]
# Deliberately narrow. This codebase is already written to a consistent, careful
# standard, and a blanket ruleset flags ~250 "issues" that are almost entirely
# style disagreements with deliberate choices. Enabling those would bury the
# handful of rules that find real defects, and CI that cries wolf gets ignored.
#
# Enabled:
#   F   pyflakes      — undefined names, unused imports/variables. Real bugs.
#                       Found 19 on first run, including four uses of `Any`
#                       that was never imported in utils/chat.py.
#   E9  syntax errors — non-negotiable.
#   B   bugbear       — genuine footguns (mutable defaults, loop-variable capture).
#   S   bandit subset — see per-rule selection below; security only.
select = ["F", "E9", "B", "S102", "S103", "S108", "S306", "S307", "S324", "S501", "S602", "S605"]

# Not selected above, and deliberately so: BLE001 (blind `except Exception`).
# It is used pervasively and on purpose — this pipeline degrades rather than
# fails (enrichment branches, store writes, cache reads) and each site is
# commented with why. Enabling it would flag 44 intentional decisions.
ignore = [
    # Loop-variable capture. The only occurrences (logical_layout.py's pref_abs)
    # consume the closure inside the same iteration, so late binding never
    # manifests. Re-check if a closure there ever starts escaping the loop.
    "B023",
    # zip() without strict=. DEFERRED, not dismissed — silent truncation on
    # mismatched lengths is a real bug class, but strict=True *raises* where the
    # code currently truncates, so flipping all 24 sites at once could turn a
    # working path into a crash. Each site needs its own "are these always the
    # same length?" answer. Worth doing; not worth doing blind.
    "B905",
]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately assert on privates and re-import for patching.
"tests/*" = ["S101", "F811"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Query() in defaults is the framework's intended usage.
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Header",
    "fastapi.File", "fastapi.Form", "fastapi.Body", "fastapi.Path",
]
